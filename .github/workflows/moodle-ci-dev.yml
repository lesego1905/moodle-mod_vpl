class Cat:
    # TODO 1: Add a colour parameter to the constructor
    def __init__(self, name, color):
        self.name = name
        self.color = color  # Store the color attribute

    def meow(self):
        print(f"Meow my name is {self.name}")

    # TODO 2: Define the jump method
    def jump(self, height):
        print(f"The {self.color} cat jumps {height} meters high")

def demo():
    cat1 = Cat("sussie", "orange")
    cat2 = Cat("Bob", "black")
    
    # TODO 3: Create a third cat
    cat3 = Cat("JOHN", "purple")

    cat1.meow()
    cat2.meow()
    cat3.meow()
    
    cat1.name = "Tiffany"
    
    # TODO 4: Change cat2's colour
    cat2.color = "white"

    cat1.meow()
    cat2.meow()
    
    # TODO 5: Call the jump method on each cat object
    cat1.jump(3)
    cat2.jump(5)
    cat3.jump(4)

    # Leave this line as it is - it hands your cats to the marker.
    return locals()
